# Run:  uv run --with mypy --with mutagen mypy
[mypy]
python_version = 3.11
strict = True
files = audit-library.py, check-artwork.py

# mutagen's tag classes (MP4, ID3, ...) are untyped, so strict mode rejects
# every call into them. That is a limitation of the dependency; exempt only
# calls into mutagen and keep the check on for all of our own code.
untyped_calls_exclude = mutagen
